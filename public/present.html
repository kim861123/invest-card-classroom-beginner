<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb"><title>INVEST PLAY | EASY판 뉴스 설명</title><style>
/* EASY V5.0 · 클래스룸 시어터 (라이트) — 빔프로젝터에서 눈이 편하고 글씨는 또렷하게 */
:root{
  --p-bg:#f4f7fb;--p-panel:#ffffff;--p-ink:#0f172a;--p-sub:#5c7085;
  --p-line:#e3eaf3;--p-blue:#3182f6;--p-blue-soft:#eaf3ff;
  --p-green:#0f9d6e;--p-red:#dc2626;--p-gold:#b45309;
  --p-shadow:0 14px 38px -22px rgba(15,23,42,.35);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:
    radial-gradient(ellipse 900px 460px at 88% -120px,#dcecff 0%,transparent 70%),
    radial-gradient(ellipse 700px 420px at -5% 4%,#fff3dd 0%,transparent 72%),
    var(--p-bg);
  color:var(--p-ink);line-height:1.55;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Segoe UI",Roboto,Arial,system-ui,sans-serif;
  word-break:keep-all;-webkit-font-smoothing:antialiased;
}
main{padding:clamp(18px,3.4vw,48px);max-width:1560px;margin:auto}
h1,h2,h3{color:var(--p-ink);letter-spacing:-.04em}
h1{font-size:clamp(30px,5.4vw,62px);margin:10px 0 14px;line-height:1.16}
h2{font-size:clamp(22px,2.8vw,36px);margin:0 0 10px}
p{line-height:1.75}

.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(122deg,#ffffff 0%,#f7fbff 56%,#fffaf1 100%);
  border:1px solid var(--p-line);border-radius:28px;
  padding:clamp(22px,3.2vw,44px);
  box-shadow:0 22px 55px -32px rgba(15,23,42,.4),inset 0 1px #fff;
}
.hero p:first-child{
  display:inline-block;margin:0 0 6px;padding:7px 15px;border-radius:999px;
  background:var(--p-blue-soft);border:1px solid #d6e7fb;color:#1f6fe0;
  font-size:clamp(11px,1.1vw,14px);font-weight:800;letter-spacing:.14em;
}
#stage{
  margin:0 0 18px;color:var(--p-sub);font-weight:700;
  font-size:clamp(14px,1.7vw,24px);
}

.present-tools{display:flex;flex-wrap:wrap;gap:10px}
.present-tools button{
  font:inherit;font-weight:800;cursor:pointer;
  min-height:52px;padding:12px 20px;border-radius:14px;
  border:1px solid #dbe5f1;background:#fff;color:#22364f;
  font-size:clamp(14px,1.3vw,18px);
  box-shadow:0 2px 6px -4px rgba(15,23,42,.4);
  transition:background .16s,border-color .16s,transform .16s;
}
.present-tools button:hover{background:#f4f9ff;border-color:#bfd8fb;color:#1f6fe0;transform:translateY(-1px)}
.present-tools button[aria-pressed="true"]{
  background:linear-gradient(180deg,#4a94fb,#3182f6);border-color:#2f7ef0;color:#fff;
  box-shadow:0 10px 22px -14px rgba(49,130,246,.95);
}
button:focus-visible{outline:3px solid rgba(49,130,246,.45);outline-offset:2px}
#notice{margin-top:14px;color:#7c8ea6;font-size:clamp(12px,1.1vw,15px)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:24px}
.panel{
  background:var(--p-panel);border:1px solid var(--p-line);border-radius:20px;
  padding:22px;box-shadow:var(--p-shadow);min-width:0;
}
.panel h2{font-size:clamp(19px,1.8vw,27px);display:flex;align-items:center;gap:8px}
.panel h3{font-size:clamp(15px,1.3vw,20px);margin:0 0 6px;line-height:1.45}
.panel small{color:#93a5bb;font-weight:750;letter-spacing:.04em}
.panel p{color:#4b5563;font-size:clamp(13px,1.05vw,16px);margin:6px 0 0}
#news article{padding:13px 0;border-bottom:1px solid #eef2f7}
#news article:last-child{border-bottom:0}
#news article small{display:block;margin-bottom:5px;color:#b45309;font-size:12px}

.price{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid #eef2f7;font-size:clamp(14px,1.2vw,19px)}
.price:last-child{border-bottom:0}
.price span{color:#334155}
.price b{font-variant-numeric:tabular-nums;font-weight:900}
.up{color:var(--p-green)}
.down{color:var(--p-red)}
.price-reveal{animation:priceReveal .7s cubic-bezier(.2,.85,.2,1) both;transform-origin:center}
@keyframes priceReveal{from{opacity:0;transform:perspective(600px) rotateX(-75deg) translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.price-reveal{animation:none!important}}

.rank{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid #eef2f7;font-size:clamp(14px,1.2vw,19px);color:#334155}
.rank:last-child{border-bottom:0}
.rank strong{color:#0f172a;font-variant-numeric:tabular-nums}

/* 뉴스 집중 모드 */
#news-focus{
  background:linear-gradient(170deg,#ffffff,#fcfdff);
  border:1px solid var(--p-line);border-top:5px solid #1e3a5f;
  border-radius:26px;margin-top:22px;padding:clamp(22px,3.6vw,64px);
  box-shadow:0 24px 60px -36px rgba(15,23,42,.4);
}
#news-focus h2{
  font-family:"Noto Serif KR",Georgia,serif;
  font-size:clamp(28px,4.2vw,64px);line-height:1.32;margin:10px 0 18px;letter-spacing:-.045em;
}
#news-focus small{display:inline-block;padding:6px 12px;border-radius:999px;background:#eef2f7;color:#2b4a6b;font-weight:800;font-size:clamp(12px,1vw,15px)}
#news-focus .large-fact{
  font-size:clamp(19px,2.3vw,36px);line-height:1.75;white-space:pre-wrap;
  color:#243b53;margin:18px 0 20px;
}
#news-focus b{color:#1f6fe0;font-size:clamp(16px,1.6vw,24px)}
#news-focus .large-question{
  font-size:clamp(17px,1.9vw,28px);line-height:1.6;
  border-left:6px solid #f0b849;border-radius:12px;
  background:#fff8e4;color:#6b4703;padding:16px 22px;margin-top:16px;
}
#news-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
#news-tabs button{
  font:inherit;font-weight:800;cursor:pointer;min-height:48px;padding:10px 18px;
  border-radius:12px;border:1px solid #dbe5f1;background:#fff;color:#475569;
  font-size:clamp(13px,1.1vw,17px);
}
#news-tabs button[aria-pressed="true"]{background:linear-gradient(180deg,#4a94fb,#3182f6);border-color:#2f7ef0;color:#fff}
.news-mode .grid,.news-mode .awards{display:none}
.news-mode #news-focus{display:block}
#news-focus[hidden]{display:none!important}

/* 시상식 */
.awards{
  border:1px solid #f0e2c6;border-radius:24px;margin-top:26px;padding:clamp(20px,2.6vw,34px);
  background:
    radial-gradient(ellipse 60% 50% at 50% -10%,#fff1d2 0%,transparent 70%),
    linear-gradient(160deg,#ffffff,#f8fbff 60%,#fffaf1);
  box-shadow:0 22px 55px -34px rgba(15,23,42,.35);
}
.awards[hidden]{display:none}
.awards h2{color:#0f172a;text-align:center}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:14px;margin:22px 0}
.podium>div{
  text-align:center;background:#f8fbff;border:1px solid #e3eaf3;border-radius:18px;
  padding:26px 10px;font-size:clamp(14px,1.9vw,24px);color:#0f172a;
  box-shadow:0 12px 28px -24px rgba(15,23,42,.45);
}
.podium>div:first-child{min-height:130px}
.podium>div:nth-child(2){background:linear-gradient(170deg,#fff8ea,#ffeec9);border-color:#f3d9a8;min-height:175px}
.podium>div:last-child{min-height:100px;background:linear-gradient(170deg,#fdf6f1,#f7eadd)}
.podium strong{display:block;margin-top:4px;font-variant-numeric:tabular-nums;color:#0f172a}
.awards>p{text-align:center;color:#64748b}

footer{margin-top:26px;padding:18px 2px 30px;color:#93a5bb;font-size:clamp(11px,1vw,14px);border-top:1px solid var(--p-line)}
.footer strong{color:#5c7085}

@media(max-width:640px){
  .present-tools button{flex:1;min-width:130px;font-size:14px}
  .hero{border-radius:20px}
  #news-focus{border-radius:18px;padding:20px}
  .podium{gap:8px}
}
</style></head><body><main><header class="hero"><p>INVEST PLAY · CLASSROOM THEATER</p><h1>시장의 선택, 우리의 투자</h1><p id="stage">화면을 준비하고 있습니다…</p><div class="present-tools"><button type="button" id="mode-news">뉴스 크게 설명하기</button><button type="button" id="mode-overview">현황 보기</button><button type="button" id="fullscreen">전체 화면</button></div></header><div id="notice"></div><section id="news-focus" hidden aria-label="뉴스 수업 설명"><div id="news-tabs"></div><article id="focus-article"></article></section><section id="awards" class="awards" hidden></section><section class="grid"><div class="panel"><h2>오늘의 경제신문</h2><div id="news"></div></div><div class="panel"><h2>산업별 가격 변화</h2><div id="prices"></div></div><div class="panel"><h2>실시간 팀 순위</h2><div id="ranks"></div></div></section><footer><p class="footer">경제교육용 시뮬레이션 · 개별 뉴스 발표 직후의 실제 투자수익률과 다를 수 있습니다. · <strong>EASY V5.0</strong></p></footer></main><script type="module" src="/present.js?v=easy-v5.0"></script></body></html>
